services:
  moecloud:
    image: ghcr.io/maximiliangt500/moecloud:${MOECLOUD_TAG:-latest}
    build: .
    container_name: moecloud
    restart: unless-stopped
    ports:
      - '${MOECLOUD_BIND:-0.0.0.0}:${MOECLOUD_PORT:-3000}:3000'
    environment:
      TZ: ${TZ:-Europe/Berlin}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      UPDATE_CHECK_URL: ${UPDATE_CHECK_URL:-}
      BREACH_CHECK_URL: ${BREACH_CHECK_URL:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      OFFICE_URL: ${OFFICE_URL:-http://office:3000}
      COLLABORA_URL: ${COLLABORA_URL:-}
      COLLABORA_INTERNAL_URL: ${COLLABORA_INTERNAL_URL:-http://collabora:9980}
      COLLABORA_WOPI_URL: ${COLLABORA_WOPI_URL:-http://moecloud:3000}
      PLUGINS: ${PLUGINS:-}
      PLUGIN_UPLOAD: ${PLUGIN_UPLOAD:-}
      PLUGINS_DEV: ${PLUGINS_DEV:-}
      DATABASE_URL: ${DATABASE_URL:-}
      PROCESSING_WORKERS: ${PROCESSING_WORKERS:-}
      BACKUP_COPY_DIR: ${BACKUP_COPY_DIR:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_LABEL: ${OIDC_LABEL:-}
      OIDC_AUTO_CREATE: ${OIDC_AUTO_CREATE:-}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      MOECLOUD_INSTALL: ${MOECLOUD_INSTALL:-docker}
    volumes:
      - ./data:/data
    networks:
      - default
      - office
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  collabora:
    image: collabora/code:${COLLABORA_TAG:-latest}
    container_name: moecloud-collabora
    restart: unless-stopped
    environment:
      aliasgroup1: http://moecloud:3000
      extra_params: --o:ssl.enable=false ${OFFICE_HTTPS:+--o:ssl.termination=true}${DOMAIN:+ --o:ssl.termination=true}
      dictionaries: ${OFFICE_DICTIONARIES:-de_DE en_US}
      TZ: ${TZ:-Europe/Berlin}
    networks:
      - office
    cap_add:
      - MKNOD
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  office:
    image: gotenberg/gotenberg:8-libreoffice
    container_name: moecloud-office
    restart: unless-stopped
    environment:
      API_TIMEOUT: 150s
      LOG_LEVEL: warn
      LIBREOFFICE_DENY_PRIVATE_IPS: 'true'
      WEBHOOK_DISABLE: 'true'
      TZ: ${TZ:-Europe/Berlin}
    networks:
      - office
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  clamav:
    image: clamav/clamav:stable
    container_name: moecloud-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: 'true'
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - clamav-db:/var/lib/clamav
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  caddy:
    image: caddy:2-alpine
    profiles:
      - caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    depends_on:
      moecloud:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  office:
    internal: true

volumes:
  clamav-db:
  caddy-data:
  caddy-config:
