services:
  moecloud:
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
    depends_on:
      clamav:
        condition: service_started

  clamav:
    image: clamav/clamav:stable
    container_name: moecloud-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: 'true'
    volumes:
      - clamav-db:/var/lib/clamav
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  clamav-db:
