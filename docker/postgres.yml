services:
  moecloud:
    environment:
      DATABASE_URL: postgres://moecloud@postgres:5432/moecloud
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in der .env}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: moecloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: moecloud
      POSTGRES_DB: moecloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in der .env}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./postgres:/var/lib/postgresql
    shm_size: 256mb
    stop_grace_period: 60s
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moecloud -d moecloud']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
