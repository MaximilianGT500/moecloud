name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Code holen
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Website prüfen
        run: node --disable-warning=ExperimentalWarning tools/check-website.ts

      - name: Pages einrichten
        uses: actions/configure-pages@v6

      - name: Website hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
