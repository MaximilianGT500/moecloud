name: Prüfung

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Formatierung prüfen
        run: npx prettier --check .

      - name: Typen prüfen
        run: npm run typecheck

      - name: Versionsangaben prüfen
        run: node tools/version.ts

      - name: Übersetzungen prüfen
        run: node tools/i18n.ts --strict

      - name: Oberfläche bauen
        run: npm run build

      - name: Tests
        run: npm test

      - name: Ablauf im Browser
        run: npm run test:browser
        env:
          TMPDIR: ${{ runner.temp }}
          SCREENSHOTS: ${{ runner.temp }}/screenshots

      - name: Bilder zu Fehlern hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-fehler
          path: ${{ runner.temp }}/moecloud-browser-fehler
          if-no-files-found: ignore

  skripte:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v7

      - name: Installationsskript und Docker-Skripte prüfen
        run: |
          bash -n install.sh
          bash install.sh --help
          shellcheck install.sh docker/entrypoint.sh docker/moecloud docker/moecloud-host

      - name: Server-Prüfung des Installationsskripts
        run: sudo MOECLOUD_LOG="$RUNNER_TEMP/install.log" bash install.sh --check --yes

      - name: Compose-Dateien prüfen
        run: |
          MOECLOUD_VERSION="$(node -p "require('./package.json').version")"
          export MOECLOUD_VERSION
          docker compose -f docker-compose.yml config --quiet
          COMPOSE_PROFILES=caddy docker compose -f docker-compose.yml -f docker/clamav.yml config --quiet
